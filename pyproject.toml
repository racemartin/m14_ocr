[project]
name = "chsa-triage"
version = "0.1.0"
description = "POC d'agent IA de triage medical pour le CHSA — architecture hexagonale"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# ----------------------------------------------------------------------
# Environnement A (local, WSL2, 5 Go RAM, sans GPU) — Etape 1
# ----------------------------------------------------------------------
local = [
    "setuptools<81",  # requis par ydata-profiling (dependance pkg_resources
                       # retiree des versions recentes de setuptools --
                       # decouvert lors du smoke test d'integration)
    "pandas>=2.2",
    "datasets>=2.20",
    "ydata-profiling>=4.9",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "transformers>=4.44",
    "huggingface_hub>=0.24",
    "mlflow>=2.14",
    "tensorboard>=2.17",
    "psutil>=6.0",
]

# ----------------------------------------------------------------------
# Environnement B (distant, HF Jobs / Spaces Dev Mode, GPU) — Etapes 2-3
# ----------------------------------------------------------------------
remote = [
    "torch>=2.3",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "unsloth",
    "liger-kernel",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "vllm>=0.5",
    "mlflow>=2.14",
    "tensorboard>=2.17",
]

# ----------------------------------------------------------------------
# Backend FastAPI (Etape 4)
# ----------------------------------------------------------------------
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# ----------------------------------------------------------------------
# Frontend Streamlit (Etape 4)
# ----------------------------------------------------------------------
web = [
    "streamlit>=1.37",
    "httpx>=0.27",
]

# ----------------------------------------------------------------------
# Outils de developpement (tous environnements)
# ----------------------------------------------------------------------
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 80
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chsa_triage"]
