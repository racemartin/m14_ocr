modele_base: Qwen/Qwen3-1.7B-Base
checkpoint_politique_depart: mombasstic/chsa-triage-sft-lora

quantification:
  # Identique a la recette SFT (meme modele de base, meme schema QLoRA
  # NF4), cf. docs/04_etape3_dpo/00_introduction_concepts.md §0/§5.
  bits: 4
  type_quantification: nf4
  double_quantification: true
  dtype_calcul: bfloat16

lora:
  # NON utilise par TrlDpoEntraineurAdapter pour construire un nouveau
  # peft.LoraConfig (l'architecture LoRA reelle est deja figee par le
  # checkpoint SFT-LoRA charge, cf. AVERTISSEMENT dans
  # infrastructure/adapters/trl_dpo_entraineur.py) : conserve ici
  # uniquement comme METADONNEE de provenance (persiste tel quel dans
  # CheckpointEntraine.configuration_lora par
  # training/E3_03_dpo_train.py), pour documenter l'architecture LoRA
  # reellement en jeu (celle du checkpoint SFT de depart), memes
  # valeurs que recipes/sft_qwen3_lora.yaml.
  rang: 16
  alpha: 32
  dropout: 0.05
  modules_cibles: [q_proj, k_proj, v_proj, o_proj]

entrainement:
  # Defaut reel verifie trl.DPOConfig (trl==1.13.0) : 0.1. Controle
  # l'ecart tolere entre pi_theta et pi_ref (cf.
  # docs/04_etape3_dpo/00_introduction_concepts.md §2).
  beta: 0.1
  # Premier run reel complet (job 6ab2d7ee51992417dfcd40cd, 2026-09-22,
  # taux 5.0e-6) : verdict sous_apprentissage, rewards/accuracies=0.30
  # (< 0.5, pire que le hasard), rewards/margins negatif. Relance a
  # 5.0e-5 (x10, reste 4x sous le taux SFT 2.0e-4) pour verifier
  # l'hypothese "taux trop bas" sur le meme run pas cher (100
  # exemples) avant d'engager le run complet a 5000 ; NON VALIDE
  # empiriquement a cette nouvelle valeur.
  taux_apprentissage: 5.0e-5
  nombre_epoques: 1
  # Remis a 4 (valeur d'origine) : le batch=1 utilise par le run
  # sous_apprentissage ci-dessus donne un gradient tres bruite (un seul
  # exemple par pas), ce qui degrade l'apprentissage independamment du
  # taux. La cause reelle de l'OOM d'evaluation qui avait motive le
  # passage a 1 est deja corrigee autrement (per_device_eval_batch_size
  # fixe explicitement = taille_lot dans trl_dpo_entraineur.py, commit
  # 250ce41) : l'entrainement A REELLEMENT REUSSI a batch=4 des le tout
  # premier run complet (job 6ab2c3e552d0dbd7f1d7fcd1, 82/82 pas), donc
  # l'evaluation a batch=4 (meme charge memoire que l'entrainement, cf.
  # ce meme commit) devrait tenir aussi ; NON RECONFIRME sur un run reel
  # depuis ce commit.
  taille_lot: 4
  # sigmoid : perte DPO "standard" (derivation §6.3 du livre
  # theorique), defaut reel trl.DPOConfig.loss_type = ['sigmoid'].
  type_perte: sigmoid
  # Defaut reel verifie trl.DPOConfig : False. Mesurer une fois un GPU
  # reel disponible (meme prudence que les optimisations non validees
  # en Etape 2, cf. AVERTISSEMENT dans trl_dpo_entraineur.py).
  precompute_ref_log_probs: false

reformulation:
  # Sous-ensemble reformule (chosen -> <think>+JSON), aligne sur la
  # taille du sous-ensemble DPO deja publie
  # (E1_05_03_extraire_sous_ensemble_dpo.py, taille_cible=5000 par
  # defaut), cf. docs/04_etape3_dpo/02_etapes_cas_usage.md §1.3. Cible
  # CUMULATIVE (comme E1_05_00_decouper_splits.py --n), pas une limite
  # par execution.
  taille_cible: 5000

suivi:
  # hf_dataset par defaut (et non mlflow) : meme raison deja documentee
  # pour la recette SFT (disque HF Jobs ephemere, cf. AGENTS.md, "premier
  # run SFT-LoRA payant a perdu sa courbe complete").
  backend: hf_dataset
  nom_experience: chsa-triage-dpo
