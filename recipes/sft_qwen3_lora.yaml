modele_base: Qwen/Qwen3-1.7B-Base

quantification:
  bits: 4
  type_quantification: nf4
  double_quantification: true
  dtype_calcul: bfloat16

lora:
  rang: 16
  alpha: 32
  dropout: 0.05
  modules_cibles: [q_proj, k_proj, v_proj, o_proj]

entrainement:
  taux_apprentissage: 2.0e-4
  nombre_epoques: 3
  taille_lot: 4
  packing: true
  # nll, pas chunked_nll : un job GPU reel (16/09/2026) a echoue a la
  # construction de SFTTrainer avec chunked_nll, car la dependance
  # "unsloth" (extra remote, non cablee dans le code) plafonne trl a
  # 0.24.0 des qu'une resolution fraiche a lieu (hf jobs uv run
  # n'utilise pas uv.lock) et 0.24.0 ne connait pas encore chunked_nll,
  # cf. infrastructure/adapters/trl_sft_entraineur.py et AGENTS.md.
  type_perte: nll
  assistant_only_loss: true

grille_hyperparametres:
  # Grid restreint (Optuna explicitement ecarte pour ce POC, cf.
  # roadmap et docs/03_etape2_sft/02_etapes_cas_usage.md) : utilise
  # seulement si la premiere passe ne converge pas proprement.
  taux_apprentissage: [1.0e-4, 2.0e-4, 5.0e-4]
  rang: [8, 16, 32]

suivi:
  # mlflow | tensorboard | hf_dataset (visualisation EN VIVO depuis un
  # Space Streamlit distant, cf. monitoring/app_suivi_entrainement.py
  # et README "Suivi d'entrainement en vivo").
  #
  # hf_dataset est le defaut DEPUIS le 16/09/2026 (et non plus mlflow) :
  # sur un job HF Jobs distant, le disque du conteneur ne survit PAS au
  # job (meme fait deja documente pour les poids LoRA et la baseline
  # GPU), donc backend: mlflow y ecrit dans un SQLite qui disparait avec
  # le conteneur. C'est reellement arrive : le premier entrainement
  # SFT-LoRA complet lance sur HF Jobs (GPU L4, verdict "saine", poids
  # publies avec succes) a perdu TOUTE sa courbe d'entrainement, malgre
  # --suivi-hf-repo passe sur la ligne de commande, parce que la recette
  # valait encore backend: mlflow a ce moment-la : training/
  # E2_04_sft_train.py::_construire_suivi() ignore silencieusement
  # --suivi-hf-repo tant que backend != hf_dataset (cf. AGENTS.md pour
  # le detail complet, et le guard `_verifier_suivi_hf_repo_coherent`
  # dans training/E2_04_sft_train.py qui refuse maintenant de demarrer
  # dans cette combinaison au lieu d'ignorer le flag en silence).
  #
  # Pour repasser a mlflow (uniquement pertinent pour un run LOCAL sur
  # GPU propre, disque persistant, jamais sur HF Jobs) :
  #   backend: mlflow
  # et ne PAS passer --suivi-hf-repo (le guard l'exigerait sinon).
  backend: hf_dataset
  nom_experience: chsa-triage-sft
