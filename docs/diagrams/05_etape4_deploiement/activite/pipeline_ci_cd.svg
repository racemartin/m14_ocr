ize="13" lengthAdjust="spacing" textLength="252.021" x="530.2764" y="827.8208">V&#233;rifie uniquement que le `Dockerfile`</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7217" x="530.2764" y="842.9536">construit (API FastAPI seule, `uv sync</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.9434" x="530.2764" y="858.0864">--extra api --no-dev --frozen`) : image</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.3613" x="530.2764" y="873.2192">JAMAIS publi&#233;e ni d&#233;ploy&#233;e par ce workflow.</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="234.5117" x="269.7646" y="829.0352"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="214.5117" x="279.7646" y="850.1738">`docker build -t chsa-triage-api:ci .`</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="186.4238" x="293.8086" y="961.6875"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="166.4238" x="303.8086" y="982.8262">&#201;chec du job "docker-build"</text><ellipse cx="387.0205" cy="1035.1719" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="387.0205" cy="1035.1719" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FDF6EC" points="327.0496,913.2852,446.9915,913.2852,458.9915,925.2852,446.9915,937.2852,327.0496,937.2852,315.0496,925.2852,327.0496,913.2852" style="stroke:#C98A1E;stroke-width:0.5;"/><text fill="#10241F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="20.6733" x="391.0205" y="947.4956">non</text><text fill="#10241F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="119.9419" x="327.0496" y="929.0933">Build Docker r&#233;ussit ?</text><text fill="#10241F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="16.7578" x="458.9915" y="922.6909">oui</text><path d="M440.6396,1078.1719 L440.6396,1124.5703 L420.6396,1128.5703 L440.6396,1132.5703 L440.6396,1178.9688 A0,0 0 0 0 440.6396,1178.9688 L796.2437,1178.9688 A0,0 0 0 0 796.2437,1178.9688 L796.2437,1088.1719 L786.2437,1078.1719 L440.6396,1078.1719 A0,0 0 0 0 440.6396,1078.1719 " fill="#FDF6EC" style="stroke:#C98A1E;stroke-width:0.5;"/><path d="M786.2437,1078.1719 L786.2437,1088.1719 L796.2437,1088.1719 L786.2437,1078.1719 " fill="#FDF6EC" style="stroke:#C98A1E;stroke-width:0.5;"/><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.7314" x="446.6396" y="1095.2388">Aucun d&#233;ploiement r&#233;el n'est d&#233;clench&#233; ici</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="284.9146" x="446.6396" y="1110.3716">(ni HF Spaces, ni registre Docker) : d&#233;cision</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="292.2842" x="446.6396" y="1125.5044">&#201;tape 4 document&#233;e, "hors p&#233;rim&#232;tre" de ce</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="285.416" x="446.6396" y="1140.6372">workflow (cf. AGENTS.md/README &#167;4.4). Le</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="305.9507" x="446.6396" y="1155.77">d&#233;ploiement effectif reste une action manuelle</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="334.604" x="446.6396" y="1170.9028">future (cf. deploiement/deploiement_etape4.puml).</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="67.2383" x="353.4014" y="1111.5859"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjus