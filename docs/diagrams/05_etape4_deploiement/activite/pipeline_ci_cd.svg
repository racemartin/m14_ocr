<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1231px" preserveAspectRatio="none" style="width:1075px;height:1231px;background:#F6F4EF;" version="1.1" viewBox="0 0 1075 1231" width="1075px" zoomAndPan="magnify"><title>&#201;tape 4 (d&#233;ploiement) : Diagramme d'activit&#233;</title><defs/><g><rect fill="#F6F4EF" height="1231" style="stroke:none;stroke-width:1;" width="1075" x="0" y="0"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="361.2861" x="355.7505" y="32.9951">&#201;tape 4 (d&#233;ploiement) : Diagramme d'activit&#233;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="1032.7871" x="20" y="49.292">Pipeline CI/CD r&#233;el (`.github/workflows/ci.yml`) : [FAIT], ex&#233;cut&#233; &#224; chaque push/PR vers `main`, aucun d&#233;ploiement r&#233;el d&#233;clench&#233;</text><ellipse cx="387.0205" cy="73.5938" fill="#0B3D3A" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="158.8789" x="307.5811" y="103.5938"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="125.8828" x="317.5811" y="124.7324">Push ou Pull Request</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="138.8789" x="317.5811" y="138.7012">vers la branche `main`</text><rect fill="#E8F0F5" height="384.0703" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:1.5;" width="600.7002" x="232.1494" y="161.5313"/><path d="M461.7539,161.5313 L461.7539,170.8281 L451.7539,180.8281 L232.1494,180.8281 " fill="none" style="stroke:#0B3D3A;stroke-width:1.5;"/><text fill="#0B3D3A" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219.6045" x="235.1494" y="175.5264">Job \"tests\" (ubuntu-latest)</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="148.7539" x="312.6436" y="197.8281"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="128.7539" x="322.6436" y="218.9668">actions/checkout@v4</text><rect fill="#FFFFFF" height="47.9375" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="155.498" x="309.2715" y="251.7969"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.498" x="319.2715" y="272.9355">astral-sh/setup-uv@v3</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="119.9531" x="319.2715" y="286.9043">(installe l'outil `uv`)</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="162.7637" x="305.6387" y="319.7344"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.7637" x="315.6387" y="340.873">`uv python install 3.11`</text><path d="M551.8916,363.7031 L551.8916,417.668 L531.8916,421.668 L551.8916,425.668 L551.8916,479.6328 A0,0 0 0 0 551.8916,479.6328 L822.8496,479.6328 A0,0 0 0 0 822.8496,479.6328 L822.8496,373.7031 L812.8496,363.7031 L551.8916,363.7031 A0,0 0 0 0 551.8916,363.7031 " fill="#FDF6EC" style="stroke:#C98A1E;stroke-width:0.5;"/><path d="M812.8496,363.7031 L812.8496,373.7031 L822.8496,373.7031 L812.8496,363.7031 " fill="#FDF6EC" style="stroke:#C98A1E;stroke-width:0.5;"/><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="246.8159" x="557.8916" y="380.77">Extras dev+local+api : m&#234;mes extras</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.1997" x="557.8916" y="395.9028">r&#233;ellement utilis&#233;s pour faire passer</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="249.958" x="557.8916" y="411.0356">la suite compl&#232;te SANS GPU/vLLM r&#233;el</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="239.2495" x="557.8916" y="426.1685">(pyyaml s&#233;par&#233;, r&#233;serv&#233; &#224; `remote`,</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="220.5747" x="557.8916" y="441.3013">cf. AGENTS.md). L'extra `remote`</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="206.7622" x="557.8916" y="456.4341">(torch/trl/peft GPU) n'est jamais</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="69.5449" x="557.8916" y="471.5669">install&#233; ici.</text><rect fill="#FFFFFF" height="47.9375" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="289.7422" x="242.1494" y="397.6992"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="269.7422" x="252.1494" y="418.8379">`uv sync --extra dev --extra local --extra api`</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="200.9355" x="252.1494" y="432.8066">+ `uv pip install "pyyaml&gt;=6.0"`</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="165.1602" x="304.4404" y="499.6328"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="145.1602" x="314.4404" y="520.7715">`uv run pytest tests/ -q`</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="141.0605" x="316.4902" y="614.0039"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="121.0605" x="326.4902" y="635.1426">&#201;chec du job "tests"</text><ellipse cx="387.0205" cy="687.4883" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="387.0205" 