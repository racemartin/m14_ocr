4,217.5,624.5244,221.5,614.5244,217.5,618.5244" style="stroke: #0B3D3A; stroke-width: 1.0;"/><line style="stroke: #0B3D3A; stroke-width: 1.5;" x1="217.5" x2="217.5" y1="672.4619" y2="692.4619"/><polygon fill="#0B3D3A" points="213.5,682.4619,217.5,692.4619,221.5,682.4619,217.5,686.4619" style="stroke: #0B3D3A; stroke-width: 1.0;"/><line style="stroke: #0B3D3A; stroke-width: 1.5;" x1="217.5" x2="217.5" y1="726.4307" y2="746.4307"/><polygon fill="#0B3D3A" points="213.5,736.4307,217.5,746.4307,221.5,736.4307,217.5,740.4307" style="stroke: #0B3D3A; stroke-width: 1.0;"/><line style="stroke: #0B3D3A; stroke-width: 1.5;" x1="217.5" x2="217.5" y1="794.3682" y2="814.3682"/><polygon fill="#0B3D3A" points="213.5,804.3682,217.5,814.3682,221.5,804.3682,217.5,808.3682" style="stroke: #0B3D3A; stroke-width: 1.0;"/><!--MD5=[d8ebadd34825d61ddc0210b48c8797ca]
@startuml pipeline_donnees

skinparam backgroundColor #F6F4EF
skinparam defaultFontName Helvetica
skinparam roundcorner 6
skinparam shadowing false
skinparam ArrowThickness 1.2

skinparam arrow {
  Color #0B3D3A
  FontColor #10241F
  FontSize 11
}

skinparam package {
  BackgroundColor #FFFFFF
  BorderColor #0B3D3A
  FontColor #0B3D3A
  FontStyle bold
  FontSize 14
}

skinparam node {
  BackgroundColor #EFEAE0
  BorderColor #0B3D3A
  FontColor #10241F
  FontSize 12
}

skinparam database {
  BackgroundColor #FDF6EC
  BorderColor #C98A1E
  FontColor #4A3400
  FontSize 11
}

skinparam cloud {
  BackgroundColor #E7EFEC
  BorderColor #2F7A4F
  FontColor #123C3A
  FontSize 12
}

skinparam artifact {
  BackgroundColor #FCEBE6
  BorderColor #C4432B
  FontColor #7A2A17
}

skinparam component {
  BackgroundColor #FFFFFF
  BorderColor #0B3D3A
  FontColor #10241F
  FontSize 12
}

skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #0B3D3A
  FontColor #10241F
  HeaderBackgroundColor #EFEAE0
  FontSize 11
  AttributeFontSize 10
}

skinparam interface {
  BackgroundColor #E7EFEC
  BorderColor #2F7A4F
  FontColor #123C3A
}

skinparam activity {
  BackgroundColor #FFFFFF
  BorderColor #0B3D3A
  FontColor #10241F
  DiamondBackgroundColor #FDF6EC
  DiamondBorderColor #C98A1E
  StartColor #0B3D3A
  EndColor #C4432B
  BarColor #0B3D3A
}

skinparam partition {
  BackgroundColor #F0EEE7
  BorderColor #0B3D3A
  FontColor #0B3D3A
  FontStyle bold
}

skinparam sequence {
  ArrowColor #0B3D3A
  ActorBorderColor #0B3D3A
  LifeLineBorderColor #0B3D3A
  LifeLineBackgroundColor #EFEAE0
  ParticipantBorderColor #0B3D3A
  ParticipantBackgroundColor #FFFFFF
  ParticipantFontColor #10241F
  ParticipantFontStyle bold
  ActorBackgroundColor #FFFFFF
  BoxBackgroundColor #F0EEE7
  BoxBorderColor #0B3D3A
}

skinparam note {
  BackgroundColor #FDF6EC
  BorderColor #C98A1E
  FontColor #4A3400
}

skinparam sequenceMessageAlign center
skinparam maxMessageSize 160
skinparam responseMessageBelowArrow true

title Étape 1 — Préparation et structuration des données\nDiagramme d'activité

start

partition "Par corpus (MediQAl, FrenchMedMCQA, MedQuAD, UltraMedical-Preference)" {
  :Placer le corpus brut dans data/raw/;
  :interfaces/cli/profiler_corpus.py\n(ProfilerCorpusUseCase);
  note right
    Adaptateurs injectés :
    LecteurCorpusFichierLocal
    YdataProfileur
  end note

  if (Rapport de profilage : nettoyage nécessaire ?) then (oui)
    :Nettoyer le corpus brut\n(doublons, valeurs manquantes, longueurs);
  else (non)
  endif

  :interfaces/cli/construire_dataset_pivot.py\n(ConstruireDatasetPivotUseCase);
  note right
    Mapper spécifique au corpus
    (mappers_corpus.py) injecté
    ici — pas dans le port
  end note
}

:Dataset pivot consolidé\n(data/processed/dataset_pivot.jsonl);

:interfaces/cli/anonymiser_dataset.py\n(AnonymiserDatasetUseCase);
note right
  Adaptateur : PresidioAnonymiseur
  Stratégie : replace / mask / redact
end note

:interfaces/cli/decouper_splits.py\n(DecouperSplitsUseCase);
note right
  Test clinique isolé — jamais
  réutilisé en entraînement
end note

:Dataset final train / val / test;

:Versionner sur Hugging Face Hub\n(Livrable 1);

stop

@enduml

