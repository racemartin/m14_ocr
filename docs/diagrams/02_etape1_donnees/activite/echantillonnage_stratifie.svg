 fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.125" x="338.4648" y="156.0591">- DecouperSplitsUseCase (param&#232;tre --n)</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="295.1914" x="338.4648" y="171.1919">Extraite pour &#233;viter de dupliquer l'algorithme</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="271.748" x="40.7168" y="119.4414"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="251.748" x="50.7168" y="140.5801">Entr&#233;e : candidats, taille, graine_aleatoire</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="264.8516" x="44.165" y="199.2578"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="244.8516" x="54.165" y="220.3965">rng = random.Random(graine_aleatoire)</text><rect fill="#FFFFFF" height="47.9375" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="219.916" x="66.6328" y="253.2266"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.6816" x="76.6328" y="274.3652">Groupement des candidats en</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="199.916" x="76.6328" y="288.334">groupes[(type_exemple, source)]</text><rect fill="#FCEBE6" height="272.1094" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:1.5;" width="331.1816" x="11" y="311.1641"/><path d="M246.7568,311.1641 L246.7568,320.4609 L236.7568,330.4609 L11,330.4609 " fill="none" style="stroke:#0B3D3A;stroke-width:1.5;"/><text fill="#0B3D3A" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="225.7568" x="14" y="325.1592">2. Calcul des quotas de base</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="247.0918" x="53.0449" y="347.4609"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="227.0918" x="63.0449" y="368.5996">Pour chaque (cle, groupe) de groupes</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="270.5469" x="41.3174" y="401.4297"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="250.5469" x="51.3174" y="422.5684">part_exacte = taille * (len(groupe) / total)</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="311.1816" x="21" y="455.3984"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="291.1816" x="31" y="476.5371">quotas[cle] = min(int(part_exacte), len(groupe))</text><rect fill="#FFFFFF" height="61.9063" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="233.5391" x="59.8213" y="509.3672"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="102.3867" x="69.8213" y="530.5059">Stocker le reste :</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="213.5391" x="69.8213" y="544.4746">(part_exacte - int(part_exacte), cle)</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="69.5508" x="69.8213" y="558.4434">dans restes</text><rect fill="#F0EEE7" height="443.2534" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:1.5;" width="269.04" x="42.0708" y="594.0752"/><path d="M301.1108,594.0752 L301.1108,603.3721 L291.1108,613.3721 L42.0708,613.3721 " fill="none" style="stroke:#0B3D3A;stroke-width:1.5;"/><text fill="#0B3D3A" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="249.04" x="45.0708" y="608.0703">3. M&#233;thode du plus grand reste</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-wi