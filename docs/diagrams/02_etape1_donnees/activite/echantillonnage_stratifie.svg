00" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="481.9966" x="338.4648" y="156.0591">- ControlerQualiteAnonymisationUseCase (&#233;chantillon de contr&#244;le qualit&#233;)</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.125" x="338.4648" y="171.1919">- DecouperSplitsUseCase (param&#232;tre --n)</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="513.6333" x="338.4648" y="186.3247">- ExtraireSousEnsembleSftUseCase (troncature au-del&#224; de --taille, 11/09/2026)</text><text fill="#4A3400" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="295.1914" x="338.4648" y="201.4575">Extraite pour &#233;viter de dupliquer l'algorithme</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="271.748" x="40.7168" y="134.5742"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="251.748" x="50.7168" y="155.7129">Entr&#233;e : candidats, taille, graine_aleatoire</text><rect fill="#FFFFFF" height="33.9688" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="264.8516" x="44.165" y="229.5234"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="244.8516" x="54.165" y="250.6621">rng = random.Random(graine_aleatoire)</text><rect fill="#FFFFFF" height="47.9375" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:0.5;" width="219.916" x="66.6328" y="283.4922"/><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.6816" x="76.6328" y="304.6309">Groupement des candidats en</text><text fill="#10241F" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="199.916" x="76.6328" y="318.5996">groupes[(type_exemple, source)]</text><rect fill="#FCEBE6" height="272.1094" rx="3" ry="3" style="stroke:#0B3D3A;stroke-width:1.5;" width="331.181